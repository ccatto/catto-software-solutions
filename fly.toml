# fly.toml — Catto Software Solutions frontend (Next.js)
# See https://fly.io/docs/reference/configuration/

app = 'catto-software-solutions'
primary_region = 'iad'

[build]
  dockerfile = "./Dockerfile"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
